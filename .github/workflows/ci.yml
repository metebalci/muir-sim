# Build, lint and test on every push and pull request, twice over: on a
# fresh clone with nothing fetched, and with the release.
#
# `check` fetches nothing and configures nothing: a fresh clone passes the
# whole suite on its own, because everything the tests read is committed.
# The tests that want a release find it absent and skip cleanly, which is
# the behavior this job also checks.
#
# `system-100` fetches System 100, the target --- the pack the engines boot
# and the sources the tests' Chaosnet server serves --- and runs the same suite
# with it there, so the tests that boot the band run, CC's own quick
# diagnostic of the machine among them. The two downloads, some 34 MB, are
# cached on the script's hash; the pack is unpacked from them on every run.
#
# `system-for-cadr` does the same with muir-sys's release for the CADR,
# its current one, the one the stable fetch script is pinned to. It is
# cached on its script's hash, so a bump of the pin is one fresh download.
# Never the rolling release: its bytes move, and a test run has to be
# repeatable. It fails if a test that wants its release said it skipped:
# such a test says "skipped:" with the release's directory or fetch script
# in the line.
#
# `handover-2002` does the same with muir-sys's hand-over of System 2002,
# unreleased, on QUUX: a pre-release whose tag never moves, which its fetch
# script pins by every file's digest. It goes when release-2002 exists.
#
# The compiler version comes from rust-toolchain.toml, so it is pinned here
# the same way it is pinned on a desk. `--locked` refuses to update
# Cargo.lock, so a dependency added without regenerating it fails the build
# --- which is what keeps "no crate dependencies" true rather than aspirational.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    # A safety net, not a budget: the job takes far less. Without it a
    # test that hangs runs until GitHub's six-hour limit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      # rust-toolchain.toml names the version and asks for clippy and rustfmt,
      # so the first cargo command installs exactly what this repo builds with.
      - name: Show the toolchain
        run: cargo --version && cargo clippy --version && cargo fmt --version

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # The engines are the workload, and profile.test builds them at
      # opt-level 2, so this is minutes rather than an hour.
      - name: Tests
        run: cargo test --locked

      # The netlists in data/ are generated from MIT's drawings in mit/ by
      # the scripts in tools/, and no `cargo test` can say so:
      # regenerating wants a C compiler for soap4 and a release build of
      # examples/reconcile.rs. So it is checked here, all eight of them, on
      # a machine that has only this repository --- which also says the
      # scripts run on a fresh clone. A netlist whose script no longer
      # reproduces it looks exactly like one that does, and that has
      # happened once already (31a403b).
      - name: Netlists regenerate byte-identical
        run: tools/check-netlists.sh

  system-100:
    runs-on: ubuntu-latest
    # A safety net, not a budget: the job takes far less. Without it a
    # test that hangs runs until GitHub's six-hour limit.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-system-100-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache the System 100 release
        uses: actions/cache@v4
        with:
          path: vendor/system-100-0
          key: system-100-${{ hashFiles('tools/fetch-system-100-for-cadr.sh') }}

      - name: Fetch the System 100 release
        run: tools/fetch-system-100-for-cadr.sh

      # Everything, with the pack there: the engines boot the band, the
      # tests' Chaosnet server serves the sources, and CC checks the machine.
      - name: Tests, with the release
        run: cargo test --locked

  handover-2002:
    runs-on: ubuntu-latest
    # A safety net, not a budget: the job takes far less. Without it a
    # test that hangs runs until GitHub's six-hour limit.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-handover-2002-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache the hand-over of System 2002
        uses: actions/cache@v4
        with:
          path: ref/band-2002-2999694
          key: handover-2002-${{ hashFiles('tools/fetch-handover-2002.sh') }}

      - name: Fetch the hand-over of System 2002
        run: tools/fetch-handover-2002.sh

      # System 2002, both disks booted on both engines to the listener on
      # the screen and to the TELNET server on the Ethernet device, on the
      # built-in PROM 2002, which is held to the hand-over's. A test that
      # found no hand-over says "skipped:", which fails the job.
      - name: Tests, with the hand-over of System 2002
        run: |
          set -o pipefail
          cargo test --locked --test system_2002 -- --nocapture 2>&1 | tee test.out
          if grep -nE 'skipped: .*(band-2002-2999694|fetch-handover-2002)' test.out; then exit 1; fi

  system-for-cadr:
    runs-on: ubuntu-latest
    # A safety net, not a budget: the job takes far less. Without it a
    # test that hangs runs until GitHub's six-hour limit.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-system-for-cadr-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache the CADR's release
        uses: actions/cache@v4
        with:
          path: vendor/system-1003
          key: system-for-cadr-${{ hashFiles('tools/fetch-system-for-cadr.sh') }}

      - name: Fetch the CADR's release
        run: tools/fetch-system-for-cadr.sh

      # Everything, with the CADR's muir-sys release there: its pack booted
      # to the listener on both engines, on its microcode renumbered, at 32
      # and 60 boards for its herald, scanned for QUUX's codes, and opened
      # read-only. A test that found no release says "skipped:", which
      # fails the job.
      - name: Tests, with the CADR's release
        run: |
          set -o pipefail
          cargo test --locked -- --nocapture 2>&1 | tee test.out
          if grep -nE 'skipped: .*(system-1003|release-1003)' test.out; then exit 1; fi
